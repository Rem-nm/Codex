# Ss2022 defaults. This file is installed under /opt/ss-manager/config/.
# It contains no server-specific data.

MANAGER_VERSION="1.0.8"
SING_BOX_REPOSITORY="SagerNet/sing-box"
MANAGER_REPOSITORY="Rem-nm/Codex"
MANAGER_RELEASE_ASSET="ss2022-manager.tar.gz"
MANAGER_CHECKSUM_ASSET="SHA256SUMS"

SING_BOX_BINARY="/usr/local/bin/sing-box"
SING_BOX_CONFIG="/etc/sing-box/config.json"
SING_BOX_SERVICE="sing-box"

PROGRAM_DIR="/opt/ss-manager"
CONFIG_DIR="/etc/ss-manager"
DATA_DIR="/var/lib/ss-manager"
RUNTIME_DIR="/run/ss-manager"
BACKUP_DIR="/etc/ss-manager/backups"

DEFAULT_PORT_MIN=10000
DEFAULT_PORT_MAX=60000
DEFAULT_RESET_DAY=1
DEFAULT_QUOTA_BYTES=0
DEFAULT_UPLOAD_LIMIT_MBPS=0
DEFAULT_DOWNLOAD_LIMIT_MBPS=0
DEFAULT_HISTORY_RETENTION=12
DEFAULT_CONFIG_BACKUP_RETENTION=10
TRAFFIC_SAMPLE_INTERVAL_SECONDS=60

# Public-IP discovery is intentionally limited to explicit HTTPS services.
PUBLIC_IPV4_ENDPOINTS=(
  "https://api.ipify.org"
  "https://ipv4.icanhazip.com"
)
PUBLIC_IPV6_ENDPOINTS=(
  "https://api6.ipify.org"
  "https://ipv6.icanhazip.com"
)
